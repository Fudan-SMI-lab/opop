[project]
name = "kernel-optimizer"
version = "0.1.0"
description = "Agent harness for GPU kernel structure search guided by parameter-tuning feedback"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
    "optuna~=4.9",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
kernel-opt = "kernel_optimizer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kernel_optimizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
