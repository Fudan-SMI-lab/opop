# STEP 3, ARM 2 of 3 -- TREATMENT 1 (`vector`, no 2e) on BOX 2 (RTX 4090).
#
# Pairs with experiments_s3_arm1_control_box1.yaml. Read that file's header for the three-arm layout
# and the reason box 3 (A800) cannot host an arm. Read experiments_l3_glm_box2_s2.yaml's header for
# the cross-box pairing evidence and the calibration precondition; neither is repeated here.
#
# THE ONLY DIFFERENCE FROM ARM 1 is `v3.diagnosis.mode`. Everything else -- budgets, evaluation,
# device, agents -- is identical, and machine paths differ because they must.
#
# THE VENV TRAP POINTS THE OPPOSITE WAY ON THIS BOX:
#   /root/autodl-tmp/orch-venv        torch 2.14.0+cu130 / triton 3.8.0   <-- NOT the worker
#   /root/autodl-tmp/kernel-opt-venv  torch 2.13.0+cu129 / triton 3.7.1   <-- the MATCHED one
# On box 1 the matched venv is orch-venv; here it is kernel-opt-venv. Copying the box 1 launch
# command would break the pairing while every other check still passed.
#
# TWO INTERPRETERS, AND THEY ARE NOT THE SAME ONE. `wsl.venv` below runs only the GPU WORKER (every
# eval, every timing); the ORCHESTRATOR runs from whichever interpreter launches the CLI, and on
# this box those must DIFFER because the matched kernel-opt-venv has no optuna:
#   DRIVER  /root/autodl-tmp/orch-venv/bin/python   (has optuna 4.9.0)
#   WORKER  /root/autodl-tmp/kernel-opt-venv        (wsl.venv below -- the matched toolchain)
# The driver's own torch/triton never compiles or times a candidate, so it does not enter a
# measurement.
#
# Launch on THIS box (concurrently with arm 1 on box 1 -- different machines):
#   cd /root/autodl-tmp/work/opop
#   PYTHONPATH=src /root/autodl-tmp/orch-venv/bin/python -m kernel_optimizer.cli \
#     --config configs/experiments_s3_arm2_vector_box2.yaml run --task level3:43

v3:
  diagnosis:
    # THE VARIABLE against arm 1. One independent judgement per resource DIMENSION reaches the
    # prompt instead of the single `kind` label. The vector is journalled in BOTH arms regardless of
    # this switch, so the comparison is about what reaches the PROMPT -- the part with an external
    # counter-example: few-shot optimisation exemplars measurably LOWERED fast_1 on KernelBench L1
    # (10% -> 6%), so more information reaching an agent is not assumed to be an improvement.
    mode: vector

    # OFF in every step-3 arm -- S2d belongs to E1 (step 4). See arm 1's header.
    expectation_ledger: false

  wall_attribution:
    # OFF here and ON in arm 3: that is the arm-2-vs-arm-3 variable.
    enabled: false
    in_prompt: false

run:
  # Box 2's own v3 runs directory, separate from its v2 `runs-l3` so the completed v2 runs there are
  # not contaminated.
  runs_dir: /root/autodl-tmp/opop-workspace/opop-glm/runs-v3
  seed: 0

kernelbench_root: /root/autodl-tmp/opop-workspace/KernelBench

opencode:
  server_url: null
  launch_cwd: /root/autodl-tmp/opop-workspace/opop-glm
  # NOTE the provider block copied here carries a plaintext API key into every agent sandbox under
  # runs_dir. A tar/scp of runs_dir carries the key off the box.
  sandbox_config_path: /root/autodl-tmp/opop-workspace/opop-glm/.opencode/opencode.jsonc
  server_env:
    OPENCODE_EXPERIMENTAL_OUTPUT_TOKEN_MAX: "131072"

wsl:
  # THE MATCHED VENV on THIS box -- see the header. NOT orch-venv, which is torch 2.14 / triton 3.8.
  venv: /root/autodl-tmp/kernel-opt-venv
  kernelbench_src: /root/autodl-tmp/opop-workspace/KernelBench/src
  triton_cache_dir: /root/autodl-tmp/.triton-cache-v3

agents:
  default_model: zhipuai/glm-5.3
  generator: {model: null, max_retries: 2, n_candidates: 4}
  rewriter: {model: null, max_retries: 2, n_candidates: 2}
  novelty: {model: null, max_retries: 2, n_candidates: 2}

budgets:
  trials_per_space: 40
  rewrite_rounds_per_family: 5
  no_improve_rounds: 2
  min_improvement_pct: 2.0
  max_families_total: 6
  max_families_active: 3
  max_families_total_hard: 6
  max_seed_candidates: 4
  repair_attempts: 3
  space_expansions_per_candidate: 1
  space_expansion_idle_frac: 0.8
  max_edge_failure_frac: 0.30
  wall_clock_hours: 12

evaluation:
  correctness_mode: dual_witness_relaxed
  relaxed_elem_tol: 0.01
  relaxed_pass_frac: 0.99
  cosine_min: 0.99985
  fp64_relative_gate: true
  fp64_rel_multiplier: 2.0
  fp64_rel_multiplier_lowp: 3.0
  correctness_trials: 5
  perf_trials: 100
  quick_correctness_trials: 3
  quick_perf_trials: 20

# Byte-identical across all three arms -- see arm 1.
device:
  name: NVIDIA GeForce RTX 4090 (sm_89)
  vram_gb: 23
  max_regs_per_thread: 255
  max_shared_bytes_static: 49152
  max_shared_bytes_optin: 101376
  max_threads_per_block: 1024
