# Config for the GLM-5.3 arm of the L3 experiments.
#
# Identical to configs/experiments_l3.yaml in EVERY budget and evaluation knob --
# only the agent model and the opencode launch directory differ, so the two arms are
# comparable as a model swap rather than a different experiment.
#
# runs_dir is INSIDE v2-glm on purpose. Agent sessions run with directory=<sandbox>,
# and opencode resolves providers by walking UP from that directory; a sandbox under
# v2/runs-glm never passes v2-glm and the zhipuai provider is not found
# (ProviderModelNotFoundError, verified live). Keeping the run dir under v2-glm puts
# the config on that path.
#
# The launch_cwd below is what gives this arm its own opencode server: the harness
# spawns `opencode serve` there on a free port, and opencode merges the configs it
# finds walking UP from that directory. v2-glm/.opencode/opencode.jsonc declares only
# zhipuai, with glm-5.3 pinned to reasoningEffort max at the model level so the depth
# applies whether or not a variant is sent.
run:
  runs_dir: D:/Pyhon_projects/opop/v2-glm/runs
  seed: 0

# This arm's own opencode server. The harness spawns `opencode serve` in launch_cwd on a
# free port, so it never shares a server with the gpt-5.6-sol arm.
opencode:
  server_url: null
  launch_cwd: D:/Pyhon_projects/opop/v2-glm
  # Each agent sandbox gets its own opencode.json, and that file makes the sandbox a
  # project root, which STOPS opencode's upward config search. A provider declared only in
  # an ancestor directory is therefore invisible from inside a sandbox -- verified live:
  # every call failed with `ProviderModelNotFoundError: Model not found: zhipuai/glm-5.3`.
  # openai never hit this because it is in the user's global config, which is always
  # loaded. Pointing at the file (rather than inlining) keeps the API key out of this
  # config and out of git.
  sandbox_config_path: D:/Pyhon_projects/opop/v2-glm/.opencode/opencode.jsonc
  # Per-turn output ceiling. opencode computes it as
  #   min(model.limit.output, OPENCODE_EXPERIMENTAL_OUTPUT_TOKEN_MAX ?? 32000)
  # so this is the ONLY route: the setting has no config-file key at all (`maxTokens` and
  # `maxOutputTokens` appear nowhere in opencode's schema, and `$AgentConfig.maxTokens` is a
  # stub with a null spec that is silently dropped). Measured by capturing the upstream
  # request bodies -- scripts/probe_glm_limit_output.py.
  #
  # WHY IT MATTERS HERE: glm-5.3 at `reasoningEffort: max` spent exactly 32000
  # output+reasoning tokens on three consecutive L3:21 generator attempts and was cut off
  # mid-planning each time, writing zero files -- run-l3-21-20260906-084636 died at its first
  # agent call. gpt-5.6-sol never came near the default (peak 6649 over 107 turns), which is
  # why 17 gpt runs gave no warning. See docs/finding-glm-truncated-before-acting.md.
  #
  # The value is a CEILING, not a request: each model's own advertised output limit wins
  # underneath it, so 200000 resolves to zhipuai's maximum of 131072 (asking for more returns
  # HTTP 400 code 1210, `max_tokens参数非法:限制数值范围[1,131072]`). Nothing model-specific is
  # encoded here, so this line is correct for any model this arm might use.
  #
  # This does NOT replace the truncation-feedback fix in AgentModule.invoke -- that fix is what
  # makes a truncated turn recoverable at all, and it got a real L3:21 generator call to two
  # contract-valid candidates in 18m16s. The ceiling reduces how often truncation happens; the
  # feedback handles it when it does.
  server_env:
    OPENCODE_EXPERIMENTAL_OUTPUT_TOKEN_MAX: "200000"

agents:
  default_model: zhipuai/glm-5.3
  generator: {model: null, max_retries: 2, n_candidates: 4}
  rewriter: {model: null, max_retries: 2, n_candidates: 2}
  novelty: {model: null, max_retries: 2, n_candidates: 2}

budgets:
  trials_per_space: 40
  # 5, was 3: at 3 the per-family round cap fired before the convergence test it defers to.
  # 3 of 16 budget-frozen families were still gaining >=2% on their final allowed round, and
  # those 3 gains (47.7%, 44.5%, 11.5%) are the largest single-round improvements in the
  # project -- while ~45% of the 12 h wall clock went unused. Cost: one round is 38.9 min
  # median, so +2 rounds is ~+2.6 h for the 2 concurrently-active families.
  # See docs/analysis-framework-defects-and-next-steps.md defect 0b.
  rewrite_rounds_per_family: 5
  no_improve_rounds: 2
  min_improvement_pct: 2.0
  # 6, was 3: at 3 Loop D was unreachable (max_seed_candidates=4 seeds -> 4 families, so the
  # novelty gate `>= max_families_total` was already true). All 19 runs have origin:novelty = 0.
  # 6 = 4 seeds + room for 2 novel families, and matches max_families_total_hard.
  # Verified first with configs/smoke_l1_novelty.yaml (run-l1-19-20260906-183211): the whole
  # NoveltyGeneratorAgent path works end to end.
  max_families_total: 6
  # 3, was 2 -- see the same block in experiments_l3.yaml. Kept identical so the GLM arm
  # differs from the gpt arm ONLY in the model and its transport settings; a budget
  # difference would confound any cross-model comparison.
  max_families_active: 3
  max_families_total_hard: 6
  max_seed_candidates: 4
  repair_attempts: 3          # improvement F: 2->3, compile+precision failures need >2 tries
  space_expansions_per_candidate: 1   # improvement K: extend boundary knobs once before rewrite
  space_expansion_idle_frac: 0.8
  max_edge_failure_frac: 0.30   # P4, see experiments_l3.yaml
  wall_clock_hours: 12

evaluation:
  correctness_mode: dual_witness_relaxed   # improvement A: tf32|ieee dual-witness relaxed gate
  relaxed_elem_tol: 0.01
  relaxed_pass_frac: 0.99
  cosine_min: 0.99985
  # Second acceptance path, ON for this round as the thing being tested. Follows
  # torch._dynamo.utils.same(): build an fp64 golden reference and accept when the
  # candidate's RMSE against it is within multiplier x the REFERENCE's own RMSE. Only
  # consulted after the absolute gate above has already failed, so it can add
  # acceptances but never remove one. Rationale and primary sources in
  # docs/research-tolerance-practice-under-reference-noise.md; all three L3 tasks have
  # ieee-vs-tf32 floors BELOW the 0.99 that relaxed_pass_frac demands
  # (0.9554 / 0.9767 / 0.9778), which makes the absolute gate unreachable for a
  # low-precision candidate however correct it is.
  fp64_relative_gate: true
  fp64_rel_multiplier: 2.0
  fp64_rel_multiplier_lowp: 3.0

# load_config reads ONE file -- default.yaml is not a base layer, so anything omitted
# here falls back to the pydantic field default rather than to default.yaml. Every
# numeric limit below happens to match its field default, but device.name did NOT: it
# defaults to "unknown", and _device_doc() writes it verbatim into every agent sandbox.
# So every agent call in every L3 run so far was told "# Target device\n\n- unknown",
# never learning the architecture is Blackwell sm_120 -- which decides which tensor-core
# paths and instructions exist at all. Stated explicitly here; see also the assertion in
# tests/test_improvements.py that keeps the two configs' device blocks in agreement.
device:
  name: RTX 5080 Laptop (sm_120)
  vram_gb: 16
  max_regs_per_thread: 255
  max_shared_bytes_static: 49152
  max_shared_bytes_optin: 101376
  max_threads_per_block: 1024
