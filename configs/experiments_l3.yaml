# Config for the two real L3 experiments (level3:21, level3:43).
run:
  runs_dir: runs
  seed: 0

agents:
  default_model: openai/gpt-5.6-sol
  generator: {model: null, max_retries: 2, n_candidates: 4}
  rewriter: {model: null, max_retries: 2, n_candidates: 2}
  novelty: {model: null, max_retries: 2, n_candidates: 2}

budgets:
  trials_per_space: 40
  # 5, was 3: at 3 the per-family round cap fired before the convergence test it defers to.
  # 3 of 16 budget-frozen families were still gaining >=2% on their final allowed round, and
  # those 3 gains (47.7%, 44.5%, 11.5%) are the largest single-round improvements in the
  # project -- while ~45% of the 12 h wall clock went unused. Cost: one round is 38.9 min
  # median, so +2 rounds is ~+2.6 h for the 2 concurrently-active families.
  # See docs/analysis-framework-defects-and-next-steps.md defect 0b.
  rewrite_rounds_per_family: 5
  no_improve_rounds: 2
  min_improvement_pct: 2.0
  # 6, was 3: at 3 Loop D was unreachable (max_seed_candidates=4 seeds -> 4 families, so the
  # novelty gate `>= max_families_total` was already true). All 19 runs have origin:novelty = 0.
  # 6 = 4 seeds + room for 2 novel families, and matches max_families_total_hard.
  # Verified first with configs/smoke_l1_novelty.yaml (run-l1-19-20260906-183211): the whole
  # NoveltyGeneratorAgent path works end to end.
  max_families_total: 6
  # 3, was 2. Raised together with Loop D: active_families() puts families with 0 rewrite
  # rounds FIRST (so a branch is never dropped before showing its headroom), which means an
  # injected novelty family jumps ahead of the incumbents. At 2 slots it would displace both
  # current leaders, and those are the likeliest source of the run's winner -- on
  # run-l3-43-20260906-091019 all four families were still gaining >=2% when frozen.
  #
  # This does NOT lengthen the run. Rounds are serial and the total available is
  # max_seed_candidates * rewrite_rounds_per_family = 20 regardless; at 38.8 min median a
  # 12 h budget affords ~18, so wall clock binds either way (L3:21 already overshot at
  # 12.82 h with active=2). It redistributes: more families reach a first round, each gets
  # fewer. See the fuller note in config.py.
  max_families_active: 3
  max_families_total_hard: 6
  max_seed_candidates: 4
  repair_attempts: 3          # improvement F: 2->3, compile+precision failures need >2 tries
  space_expansions_per_candidate: 1   # improvement K: extend boundary knobs once before rewrite
  space_expansion_idle_frac: 0.8
  # P4: prefer widening knobs whose boundary value is not already failing. Values added
  # beyond a FAILING edge fail 43% (16/37) vs 15% (13/84) beyond a healthy one. A
  # preference, not a filter -- as a filter it would empty the request list on 8 of 177
  # historical expansions and cancel them outright, two of those being their run's best
  # candidate. See scripts/audit_expansion_failure_veto.py. 1.0 disables.
  max_edge_failure_frac: 0.30
  wall_clock_hours: 12

evaluation:
  correctness_mode: dual_witness_relaxed   # improvement A: tf32|ieee dual-witness relaxed gate
  relaxed_elem_tol: 0.01
  relaxed_pass_frac: 0.99
  cosine_min: 0.99985
  # Second acceptance path, ON for this round as the thing being tested. Follows
  # torch._dynamo.utils.same(): build an fp64 golden reference and accept when the
  # candidate's RMSE against it is within multiplier x the REFERENCE's own RMSE. Only
  # consulted after the absolute gate above has already failed, so it can add
  # acceptances but never remove one. Rationale and primary sources in
  # docs/research-tolerance-practice-under-reference-noise.md; all three L3 tasks have
  # ieee-vs-tf32 floors BELOW the 0.99 that relaxed_pass_frac demands
  # (0.9554 / 0.9767 / 0.9778), which makes the absolute gate unreachable for a
  # low-precision candidate however correct it is.
  fp64_relative_gate: true
  fp64_rel_multiplier: 2.0
  fp64_rel_multiplier_lowp: 3.0

# load_config reads ONE file -- default.yaml is not a base layer, so anything omitted
# here falls back to the pydantic field default rather than to default.yaml. Every
# numeric limit below happens to match its field default, but device.name did NOT: it
# defaults to "unknown", and _device_doc() writes it verbatim into every agent sandbox.
# So every agent call in every L3 run so far was told "# Target device\n\n- unknown",
# never learning the architecture is Blackwell sm_120 -- which decides which tensor-core
# paths and instructions exist at all. Stated explicitly here; see also the assertion in
# tests/test_improvements.py that keeps the two configs' device blocks in agreement.
device:
  name: RTX 5080 Laptop (sm_120)
  vram_gb: 16
  max_regs_per_thread: 255
  max_shared_bytes_static: 49152
  max_shared_bytes_optin: 101376
  max_threads_per_block: 1024
