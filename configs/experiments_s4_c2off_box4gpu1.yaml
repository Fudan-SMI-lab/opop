# STEP 4, ARM A of 2 -- C2 ALL-OFF (control) on BOX 4, pinned to **GPU 1**.
#
# THE QUESTION. Does C2 as a WHOLE mechanism help? The three previous pairs each moved one piece and
# each came back uninterpretable for the same reason: the piece they moved produced almost no walls,
# so "no effect" and "no input" were indistinguishable.
#   * step-3 arm2 vs arm3 turned wall attribution on alone. Coverage was 1 family of 4 (25%), and the
#     winning family never received wall text -- so its 8% delta was unattributable in either
#     direction, whichever way it had fallen.
#   * the S7 pair turned slope-guided sampling on alone. 36 recomputes, ZERO enqueues: the treatment
#     arm found 0 candidate walls at all, because every refused value was later run by some other
#     partner and a wall is by definition a refused value OUTSIDE the measured range.
# So this pair stops testing pieces and tests the mechanism: everything C2 needs, off here and on in
# arm B, to make the mechanism produce something an outcome can be attributed to.
#
# WHAT IS THE VARIABLE, stated as a list because it is deliberately a COMPOUND one:
#   1. `wall_attribution` -- find the hard (shared-memory) truncation and attribute it to one knob.
#   2. `soft_wall`        -- find the truncation on knobs that have NO refusal criterion, via spills.
#   3. `slope_guide`      -- let the sampler go measure the walled value, instead of only telling the
#                            rewriter about it after tuning has ended.
# All three are one chain in C2's definition: (1)+(2) FIND the truncated high-slope dimension, (3)
# gets that information EARLIER and more reliably. A single-piece pair cannot separate them anyway --
# proven twice above -- so the honest design is to move the chain and say so.
#
# WHAT THIS PAIR CANNOT ANSWER, and it must not be reported as if it could: WHICH of the three did
# the work. That needs a decomposition pair afterwards, and only if this one separates at all.
#
# WHAT IS HELD CONSTANT, and why each one matters:
#   * `diagnosis.mode: vector` in BOTH arms. That is C1's variable, measured by its own pair
#     (-8.68% same-box, -12.0% cross-box). Moving it here would confound C1 with C2.
#   * `ordered_categoricals` OFF in both. It also changes what the sampler draws; two sampling
#     changes at once would be unattributable -- the same reason it stayed off in the S7 pair.
#   * every budget, gate, tolerance, device fact and agent setting: byte-identical to arm B.
#
# READING IT. Latency is the WEAK reading here and must not be the only one. n=1 per arm, the
# re-evaluation gap is +-2-4% with an UNSTABLE sign, and champion arrival position has ranged 0.32
# to 0.76 across finished runs -- so a latency delta under ~4% carries no ordering. The MECHANISM
# readings are what this pair is really for, and they do not depend on n:
#   * how many walls become attributable at all (arm A: structurally 0; arm B: must be > 0 or the
#     mechanism never ran and the pair is another null-input result, not a null-effect one);
#   * of the walls delivered, how many were freed by a descendant AT THE WALLED VALUE -- step-3's one
#     positive result was 1/1 against a counterfactual 0/7;
#   * what fraction of families received wall text at all (step-3: 25%).
#
# BUDGET PARITY. Align on TOTAL search, not per-space budget, and report BOTH trial counts. On the
# step-3 pair the two counts ordered the arms OPPOSITELY -- arm2 spent 800 TRIAL_DONE against arm3's
# 760 but got back FEWER usable ones (617 vs 637, failures 183 vs 123). Reporting one number there
# would have picked the winner by choice of denominator.
#
# Launch (GPU 1; simultaneously with arm B on GPU 0):
#   cd /root/autodl-tmp/work/opop
#   CUDA_VISIBLE_DEVICES=1 XDG_DATA_HOME=/root/autodl-tmp/xdg-s4a \
#   PYTHONPATH=src /root/autodl-tmp/orch-venv/bin/python -m kernel_optimizer.cli \
#     --config configs/experiments_s4_c2off_box4gpu1.yaml run --task level3:43

v3:
  # ---- THE VARIABLE: the whole C2 chain, OFF. The only block that differs from arm B. ----
  wall_attribution:
    # OFF: no hard wall is attributed, so no wall text reaches the rewriter.
    # NOTE this arm therefore CANNOT report "walls attributed = 0" as a measurement -- it is
    # structural. Arm B's count is the measurement; this side is the reference for "what the analyst
    # produces on its own", which is the real baseline (the analyst's prompt already asks it to judge
    # whether a direction is blocked by a hardware limit, and 4 of 24 hypotheses did so unaided).
    enabled: false
    in_prompt: false
    # Recorded even though they cannot fire, so the two files diff as a small set of booleans rather
    # than as blocks that exist on one side only.
    max_probes_per_candidate: 8
    probe_second_origin: true
    probe_top_k: 1

  soft_wall:
    enabled: false
    in_prompt: false
    max_rows_in_prompt: 3

  slope_guide:
    enabled: false
    recompute_every: 10
    max_enqueued_per_recompute: 2
    use_soft_wall: false

  # ---- everything below is IDENTICAL in arm B ----
  ordered_categoricals:
    # OFF in both arms: it is a second sampling change, and two at once are unattributable.
    enabled: false

  diagnosis:
    # C1's variable, held CONSTANT here. Both arms get the per-dimension resource vector.
    mode: vector
    expectation_ledger: false

run:
  runs_dir: /root/autodl-tmp/opop-workspace/opop-glm/runs-v3/s4-c2off
  seed: 0

kernelbench_root: /root/autodl-tmp/opop-workspace/KernelBench

opencode:
  server_url: null
  launch_cwd: /root/autodl-tmp/opop-workspace/opop-glm
  # NOTE the provider block copied here carries a plaintext API key into every agent sandbox under
  # runs_dir. A tar/scp of runs_dir carries the key off the box.
  sandbox_config_path: /root/autodl-tmp/opop-workspace/opop-glm/.opencode/opencode.jsonc
  server_env:
    OPENCODE_EXPERIMENTAL_OUTPUT_TOKEN_MAX: "131072"
    XDG_DATA_HOME: /root/autodl-tmp/xdg-s4a

wsl:
  # The MATCHED venv on this box -- NOT orch-venv, which is torch 2.14 / triton 3.8.
  venv: /root/autodl-tmp/kernel-opt-venv
  kernelbench_src: /root/autodl-tmp/opop-workspace/KernelBench/src
  triton_cache_dir: /root/autodl-tmp/.triton-cache-s4a

agents:
  default_model: zhipuai/glm-5.3
  generator: {model: null, max_retries: 2, n_candidates: 4}
  rewriter: {model: null, max_retries: 2, n_candidates: 2}
  novelty: {model: null, max_retries: 2, n_candidates: 2}

budgets:
  trials_per_space: 40
  rewrite_rounds_per_family: 5
  no_improve_rounds: 2
  min_improvement_pct: 2.0
  max_families_total: 6
  max_families_active: 3
  max_families_total_hard: 6
  max_seed_candidates: 4
  repair_attempts: 3
  space_expansions_per_candidate: 1
  space_expansion_idle_frac: 0.8
  max_edge_failure_frac: 0.30
  wall_clock_hours: 12

evaluation:
  correctness_mode: dual_witness_relaxed
  relaxed_elem_tol: 0.01
  relaxed_pass_frac: 0.99
  cosine_min: 0.99985
  fp64_relative_gate: true
  fp64_rel_multiplier: 2.0
  fp64_rel_multiplier_lowp: 3.0
  correctness_trials: 5
  perf_trials: 100
  quick_correctness_trials: 3
  quick_perf_trials: 20

device:
  name: NVIDIA GeForce RTX 4090 (sm_89)
  vram_gb: 23
  max_regs_per_thread: 255
  max_shared_bytes_static: 49152
  max_shared_bytes_optin: 101376
  max_threads_per_block: 1024
