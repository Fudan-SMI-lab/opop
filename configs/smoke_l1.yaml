# Cheap smoke config for development: small budgets, L1 tasks.
run:
  runs_dir: runs
  seed: 0

agents:
  default_model: openai/gpt-5.6-sol
  generator: {model: null, max_retries: 2, n_candidates: 2}
  rewriter: {model: null, max_retries: 2, n_candidates: 1}
  novelty: {model: null, max_retries: 2, n_candidates: 1}

budgets:
  trials_per_space: 8
  rewrite_rounds_per_family: 1
  no_improve_rounds: 1
  min_improvement_pct: 2.0
  max_families_total: 2
  max_families_active: 2
  max_seed_candidates: 2
  repair_attempts: 1
  wall_clock_hours: 3

evaluation:
  correctness_trials: 5
  perf_trials: 100
  quick_correctness_trials: 3
  quick_perf_trials: 20

# load_config reads ONE file (default.yaml is not a base layer), and
# DeviceLimits.name defaults to "unknown" -- which _device_doc() writes verbatim into
# every agent sandbox. State it here too so smoke runs exercise the same doc as L3.
device:
  name: RTX 5080 Laptop (sm_120)
  vram_gb: 16
  max_regs_per_thread: 255
  max_shared_bytes_static: 49152
  max_shared_bytes_optin: 101376
  max_threads_per_block: 1024
