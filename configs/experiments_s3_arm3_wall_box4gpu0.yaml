# STEP 3, ARM 3 of 3 -- TREATMENT 2 (`vector` + 2e) on BOX 4, pinned to **GPU 0**.
#
# Read experiments_s3_arm2_vector_box4gpu1.yaml's header first. It carries, and this file does not
# repeat: the three-arm topology, the MEASURED evidence that two cards in one chassis do not perturb
# each other's timing (+1.20% worst median shift), why the per-run GPU lock never enforced the
# one-run-per-box rule, the three things isolated per arm, the shared-calibration decision and the
# +35% launch-floor field that motivated it, and the inherited venv trap.
#
# This file differs from ARM 2 in exactly the two `wall_attribution` switches, plus the three
# per-arm isolation values (runs_dir, triton_cache_dir, XDG_DATA_HOME) that MUST differ because the
# two arms share a box. It differs from ARM 1 in those plus `diagnosis.mode`.
#
# NO LONGER SEQUENTIAL. An earlier version of this arm waited for arm 1 to finish on box 1, because
# a second card was not available. It now runs at the same time as both other arms.
#
# WHAT THIS ARM TESTS (A3). The two arms above ask whether per-dimension JUDGEMENT beats a single
# label. This one adds a MEASUREMENT: for each knob whose refused value lies outside its tried range,
# the harness moves that ONE knob to the refused value at the candidate's own optimum and asks the
# compiler. A refusal attributes the wall to that knob alone.
#
#   PRIMARY OUTCOME, and it is not latency: does a rewrite aimed at an attributed wall actually FREE
#   that dimension -- `shared_bytes` falls, and the knob's refused value becomes feasible again (the
#   same compile-only probe, re-run on the rewritten source). Both are objective, and both are
#   readable from the log without a judgement call.
#
#   SECONDARY, DECLARED UNDER-POWERED IN ADVANCE: latency. G9 measured `verdict` vs `rich` 4.19%
#   apart against a 4.72% within-arm spread, i.e. not separated; this arm's expected effect is
#   SMALLER than arm 2's, so a null latency result is the prediction, not a disappointment. Saying so
#   here rather than afterwards is the point.
#
# WHY THE MEASUREMENT IS WORTH AN ARM. The conclusion it produces already exists as a field the
# analyst agent fills unchecked (`BottleneckReport.parameter_limits`). Measured on box 2's two L3:43
# runs: of 53 such claims across the six candidates that actually have a wall, the harness confirms
# EIGHT -- with the wrong resource named, walls claimed on knobs that have none, and
# `predicted_gain_pct` inverted in sign (+1.0% claimed where the measured tail is -41.1%). So the
# variable here is "is the sentence about which knob is blocked a guess or a measurement".
#
# THE ATTRIBUTION IS CONDITIONAL, AND THE PROMPT TEXT SAYS SO. From the candidate's optimum, 6 of 6
# walls attribute to a single knob; from the space's DEFAULT configuration, only 1 of 6. At the
# default every dimension sits at its smallest, so enlarging one knob still fits. The wall's position
# therefore depends on the other knobs, and an unconditional reading ("BLOCK_M is capped by shared
# memory") would send the rewriter after a wall that does not exist where it is standing.
#
# THE MEASUREMENT REACHES THE REWRITER DIRECTLY, not via the analyst. The rewriter's only view of the
# diagnosis is `analysis/bottleneck.json` -- the analyst's OUTPUT -- so routing 2e through the analyst
# would deliver the measured wall only if the analyst chose to restate it, through the very agent
# whose claims on this subject were confirmed 8 times out of 53. A3 would then be unattributable
# between "the wall is not a real bottleneck" and "the analyst dropped it". So `in_prompt` also writes
# `analysis/resource_walls.md` into the rewriter's sandbox, kept a SEPARATE file from the analyst's
# report because that difference is the experiment.
#
# COST, MEASURED: 18 probe variants in ONE worker process took 8.8 s on box 2 -- a marginal 0.49 s
# each, because `make_compile_probe_job`'s `extra_kernel_src_paths` pays the process start once. At
# three probed walls per candidate that is ~1.5 s against a 12 h clock (~0.003%). `probe_total_s` is
# journalled per event so it can be SUBTRACTED in the report rather than assumed to be zero.
#
# Launch (GPU 0; concurrently with arm 2 on GPU 1 and arm 1 on box 1):
#   cd /root/autodl-tmp/work/opop
#   CUDA_VISIBLE_DEVICES=0 XDG_DATA_HOME=/root/autodl-tmp/xdg-arm3 \
#   PYTHONPATH=src /root/autodl-tmp/orch-venv/bin/python -m kernel_optimizer.cli \
#     --config configs/experiments_s3_arm3_wall_box4gpu0.yaml run --task level3:43

v3:
  diagnosis:
    # SAME as arm 2. Held constant so the arm-2-vs-arm-3 difference is 2e alone.
    mode: vector

    # OFF in every step-3 arm -- S2d belongs to E1 (step 4).
    expectation_ledger: false

  wall_attribution:
    # THE VARIABLE, half 1: find the walls, probe them, journal RESOURCE_WALL_ATTRIBUTED.
    enabled: true

    # THE VARIABLE, half 2: the attributed walls reach the analyst AND the rewriter.
    in_prompt: true

    # Diagnostic depth, NOT a search-space restriction: nothing here removes, shrinks or reorders a
    # domain, and the tuner samples exactly what it sampled before. Walls beyond the cap are counted
    # in the event, so the number is never silently lost.
    max_probes_per_candidate: 8

    # Repeat each ablation from the space's DEFAULT configuration as well as from the optimum, so a
    # reader can tell an intrinsic knob limit from a joint effect at one point (6/6 vs 1/6, above).
    # Affordable precisely because the probes batch.
    probe_second_origin: true

run:
  # PER-ARM directory, distinct from arm 2's. Two co-resident runs must not share a GPU lock
  # (`store.run_dir/jobs/gpu.lock`), a jobs dir, or an events log.
  runs_dir: /root/autodl-tmp/opop-workspace/opop-glm/runs-v3/arm3
  seed: 0

kernelbench_root: /root/autodl-tmp/opop-workspace/KernelBench

opencode:
  server_url: null
  launch_cwd: /root/autodl-tmp/opop-workspace/opop-glm
  # NOTE the provider block copied here carries a plaintext API key into every agent sandbox under
  # runs_dir. A tar/scp of runs_dir carries the key off the box.
  sandbox_config_path: /root/autodl-tmp/opop-workspace/opop-glm/.opencode/opencode.jsonc
  server_env:
    OPENCODE_EXPERIMENTAL_OUTPUT_TOKEN_MAX: "131072"
    # Isolate this arm's opencode state from arm 2's -- one SQLite db per box otherwise, written by
    # both. See arm 2's header for the verification that XDG_DATA_HOME relocates it.
    XDG_DATA_HOME: /root/autodl-tmp/xdg-arm3

wsl:
  # THE MATCHED VENV on this box -- NOT orch-venv, which is torch 2.14 / triton 3.8.
  venv: /root/autodl-tmp/kernel-opt-venv
  kernelbench_src: /root/autodl-tmp/opop-workspace/KernelBench/src
  # PER-ARM cache: sharing with arm 2 would let one arm hit the other's compilations.
  triton_cache_dir: /root/autodl-tmp/.triton-cache-arm3

agents:
  default_model: zhipuai/glm-5.3
  generator: {model: null, max_retries: 2, n_candidates: 4}
  rewriter: {model: null, max_retries: 2, n_candidates: 2}
  novelty: {model: null, max_retries: 2, n_candidates: 2}

budgets:
  trials_per_space: 40
  rewrite_rounds_per_family: 5
  no_improve_rounds: 2
  min_improvement_pct: 2.0
  max_families_total: 6
  max_families_active: 3
  max_families_total_hard: 6
  max_seed_candidates: 4
  repair_attempts: 3
  space_expansions_per_candidate: 1
  space_expansion_idle_frac: 0.8
  max_edge_failure_frac: 0.30
  wall_clock_hours: 12

evaluation:
  correctness_mode: dual_witness_relaxed
  relaxed_elem_tol: 0.01
  relaxed_pass_frac: 0.99
  cosine_min: 0.99985
  fp64_relative_gate: true
  fp64_rel_multiplier: 2.0
  fp64_rel_multiplier_lowp: 3.0
  correctness_trials: 5
  perf_trials: 100
  quick_correctness_trials: 3
  quick_perf_trials: 20

# Byte-identical across all three arms -- see arm 2.
device:
  name: NVIDIA GeForce RTX 4090 (sm_89)
  vram_gb: 23
  max_regs_per_thread: 255
  max_shared_bytes_static: 49152
  max_shared_bytes_optin: 101376
  max_threads_per_block: 1024
