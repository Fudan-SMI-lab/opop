# Smoke config specifically to exercise loop D (novelty): a single seed family
# with zero rewrite budget freezes immediately, so round 1 must go to novelty.
run:
  runs_dir: runs
  seed: 0

agents:
  default_model: openai/gpt-5.6-sol
  generator: {model: null, max_retries: 2, n_candidates: 1}
  rewriter: {model: null, max_retries: 2, n_candidates: 1}
  novelty: {model: null, max_retries: 2, n_candidates: 1}

budgets:
  trials_per_space: 4
  rewrite_rounds_per_family: 0
  no_improve_rounds: 1
  min_improvement_pct: 2.0
  # 3, was 2: at 2 the run ended after ONE accepted novel family, because the second
  # attempt was gated off and (pre-D2) a novelty miss froze everything. With 3 the smoke
  # exercises a second novelty attempt AND the post-D2 behaviour that the run continues.
  max_families_total: 3
  max_families_active: 3
  max_seed_candidates: 1
  repair_attempts: 1
  wall_clock_hours: 3

evaluation:
  correctness_trials: 5
  perf_trials: 100
  quick_correctness_trials: 3
  quick_perf_trials: 20

# load_config reads ONE file (default.yaml is not a base layer), and
# DeviceLimits.name defaults to "unknown" -- which _device_doc() writes verbatim into
# every agent sandbox. State it here too so smoke runs exercise the same doc as L3.
device:
  name: RTX 5080 Laptop (sm_120)
  vram_gb: 16
  max_regs_per_thread: 255
  max_shared_bytes_static: 49152
  max_shared_bytes_optin: 101376
  max_threads_per_block: 1024
