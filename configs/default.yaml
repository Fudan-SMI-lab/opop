run:
  runs_dir: runs
  seed: 0

opencode:
  server_url: null              # null => harness launches `opencode serve`
  launch_cwd: D:/Pyhon_projects/opop
  host: 127.0.0.1
  port: 4096
  agent: build
  # 25 min. A timed-out agent call is HUNG, not slow: over all 982 successful calls on record
  # none exceeded 1200 s (max 1167 s), while 14 of the 15 ReadTimeout kills finished on a
  # retry in ~4 min (median). So this value is not a work budget, it is the price of noticing
  # a hang -- the 18 hangs on record cost 9.00 h at 1800 s against 7.50 h at 1500 s. Kept
  # above 1200 s because the slowest successful call, 1167 s, leaves only 2.9% headroom
  # there. See OpencodeConfig.request_timeout_s and scripts/probe_agent_timeouts.py.
  request_timeout_s: 1500
  permission_mode: sandbox_config   # or sse_auto_approve

agents:
  default_model: openai/gpt-5.6-sol
  generator: {model: null, max_retries: 2, n_candidates: 4}
  parameterizer: {model: null, max_retries: 2}
  analyst: {model: null, max_retries: 1}
  rewriter: {model: null, max_retries: 2, n_candidates: 2}
  novelty: {model: null, max_retries: 2, n_candidates: 2}
  repair: {model: null, max_retries: 2}

budgets:
  trials_per_space: 40
  # 5, was 3: at 3 the per-family round cap fired before the convergence test it defers to.
  # 3 of 16 budget-frozen families were still gaining >=2% on their final allowed round, and
  # those 3 gains (47.7%, 44.5%, 11.5%) are the largest single-round improvements in the
  # project -- while ~45% of the 12 h wall clock went unused. Cost: one round is 38.9 min
  # median, so +2 rounds is ~+2.6 h for the 2 concurrently-active families.
  # See docs/analysis-framework-defects-and-next-steps.md defect 0b.
  rewrite_rounds_per_family: 5
  no_improve_rounds: 2
  min_improvement_pct: 2.0
  # 6, was 3: at 3 Loop D was unreachable (max_seed_candidates=4 seeds -> 4 families, so the
  # novelty gate `>= max_families_total` was already true). All 19 runs have origin:novelty = 0.
  # 6 = 4 seeds + room for 2 novel families, and matches max_families_total_hard.
  # Verified first with configs/smoke_l1_novelty.yaml (run-l1-19-20260906-183211): the whole
  # NoveltyGeneratorAgent path works end to end.
  max_families_total: 6
  max_families_active: 3   # 3, was 2 -- see the comment in experiments_l3.yaml
  max_seed_candidates: 4
  repair_attempts: 2
  wall_clock_hours: 12

evaluation:
  correctness_trials: 5
  perf_trials: 100
  quick_correctness_trials: 3
  quick_perf_trials: 20
  timing_method: cuda_event
  precision: fp32
  # Stated explicitly rather than left to the field default, because `load_config` reads ONE
  # yaml with no base layer: an omitted key falls back to the dataclass default silently, and
  # for this key that default is `strict` -- a whole-tensor allclose(atol=1e-4, rtol=1e-4).
  # That gate contradicts this file's own advice to reach for the tensor cores: all three L3
  # tasks measure a two-precision noise floor (0.9554/0.9767/0.9778) BELOW what strict
  # requires, so a correct tf32/fp16 kernel is rejected for being a tf32/fp16 kernel.
  #
  # `strict` is kept here as the default anyway, and that is a deliberate choice, not
  # inertia: on elementwise L1-style tasks the tight gate is the right one and catches real
  # numerical sloppiness. Every L3 experiment config overrides this with
  # `dual_witness_relaxed`. If you write a new config for a task whose reference has a
  # non-trivial two-precision spread, override it there too -- and measure that spread first
  # (scripts/ has probes for it), because it is the number this gate has to clear.
  correctness_mode: strict
  eval_timeout_s: 600
  build_timeout_s: 1200
  # No `excessive_speedup` / `suspicious_speedup` here on purpose. The implausible-speedup flag
  # is now DERIVED per task per box -- the task's compulsory traffic and arithmetic against this
  # card's measured bandwidth and peak give a floor no correct kernel can beat, and the flag
  # threshold is that floor times a margin (evaluation/plausibility.py). The old 10x constant
  # fired on all three L3:48 runs, whose reference materializes 40.5x its own compulsory traffic
  # so that a LEGAL fusion necessarily exceeds it, and would have been far too loose on a task
  # whose reference is already lean. `suspicious_speedup: 2.0` had no consumer at all.

gpu:
  concurrency:
    enabled: true
    max_shared_jobs: 2          # correctness/compile/static-check lanes only
    vram_budget_frac: 0.45
    timing_cooldown_s: 2

wsl:
  distro: Ubuntu
  # MUST be on ext4, never /mnt/* (9p): 26.8s vs 2.4s of per-worker startup, measured.
  # Build with scripts/setup_wsl_venv.sh.
  venv: ~/kernel-opt-venv
  kernelbench_src: /mnt/d/Pyhon_projects/opop/KernelBench/src
  extra_pythonpath: ""                                       # optional pip --target dir
  triton_cache_dir: ~/.triton-cache-kopt                     # ext4 too, same reason

device:
  name: RTX 5080 Laptop (sm_120)
  vram_gb: 16
  max_regs_per_thread: 255
  max_shared_bytes_static: 49152
  max_shared_bytes_optin: 101376
  max_threads_per_block: 1024

kernelbench_root: D:/Pyhon_projects/opop/KernelBench
